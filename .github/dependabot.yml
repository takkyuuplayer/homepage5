version: 2

updates:
  - package-ecosystem: "github-actions"
    directory: "/" # https://docs.github.com/en/code-security/reference/supply-chain-security/dependabot-options-reference#directories-or-directory--
    schedule:
      interval: "cron"
      cronjob: "0 0 1 * *"
    groups:
      github-actions:
        patterns:
          - "*"
    cooldown:
      default-days: 7
  - package-ecosystem: "npm"
    directory: "/"
    ignore:
      # astro check requires the TypeScript Language Service API missing in TS 7.
      # Remove when @astrojs/check supports TS 7.
      # https://github.com/withastro/roadmap/discussions/1321
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
    schedule:
      interval: "cron"
      cronjob: "0 0 1 * *"
    groups:
      npm:
        patterns:
          - "*"
    cooldown:
      default-days: 7
